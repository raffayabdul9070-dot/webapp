name: heatwave_alert_system
description: >
  Automated, location-targeted heatwave alert system built on FortyGuard's
  live temperature feed. Monitors a selected grid (default: Ohio) and
  triggers instant alerts to responders and registered residents when a
  critical heat threshold is crossed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
